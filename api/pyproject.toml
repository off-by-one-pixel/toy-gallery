[project]
name = "toy-gallery"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2.5",
    "django-cors-headers>=4.7.0",
    "djangorestframework>=3.16.1",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.28.0",
    "gunicorn>=23.0.0",
    "requests>=2.34.2",
    "whitenoise>=6.9.0",
]

[dependency-groups]
dev = [
    "coverage>=7.13.5",
    "django-silk>=5.5.2",
    "django-types>=0.23.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["toys/migrations"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"toy_gallery/settings_*.py" = ["F403", "F405"]
