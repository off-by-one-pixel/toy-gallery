openapi: 3.0.3
info:
  title: Toy Gallery API
  version: 1.0.0
paths:
  /toys/change_password/:
    post:
      operationId: toys_change_password_create
      tags:
      - toys
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /toys/sessions/:
    get:
      operationId: toys_sessions_list
      tags:
      - toys
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'
          description: ''
    post:
      operationId: toys_sessions_create
      tags:
      - toys
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SessionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SessionRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
  /toys/sessions/{id}/:
    get:
      operationId: toys_sessions_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this session.
        required: true
      tags:
      - toys
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
    put:
      operationId: toys_sessions_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this session.
        required: true
      tags:
      - toys
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SessionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SessionRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
    patch:
      operationId: toys_sessions_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this session.
        required: true
      tags:
      - toys
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSessionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSessionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSessionRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
    delete:
      operationId: toys_sessions_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this session.
        required: true
      tags:
      - toys
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /toys/sessions/{id}/media/:
    get:
      operationId: toys_sessions_media_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this session.
        required: true
      tags:
      - toys
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionMediaResponse'
          description: ''
  /toys/sessions/activity/:
    get:
      operationId: toys_sessions_activity_retrieve
      tags:
      - toys
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityResponse'
          description: ''
  /toys/sessions/media-indicators/:
    get:
      operationId: toys_sessions_media_indicators_retrieve
      tags:
      - toys
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionMediaIndicators'
          description: ''
  /toys/sessions/refresh-media/:
    post:
      operationId: toys_sessions_refresh_media_create
      tags:
      - toys
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionMediaIndicators'
          description: ''
  /toys/token/:
    post:
      operationId: toys_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - toys
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /toys/token/refresh/:
    post:
      operationId: toys_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - toys
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /toys/toys/:
    get:
      operationId: toys_toys_list
      tags:
      - toys
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Toy'
          description: ''
    post:
      operationId: toys_toys_create
      tags:
      - toys
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ToyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ToyRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Toy'
          description: ''
  /toys/toys/{id}/:
    get:
      operationId: toys_toys_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this toy.
        required: true
      tags:
      - toys
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Toy'
          description: ''
    put:
      operationId: toys_toys_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this toy.
        required: true
      tags:
      - toys
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ToyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ToyRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Toy'
          description: ''
    patch:
      operationId: toys_toys_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this toy.
        required: true
      tags:
      - toys
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedToyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedToyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedToyRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Toy'
          description: ''
    delete:
      operationId: toys_toys_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this toy.
        required: true
      tags:
      - toys
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /toys/toys/delete_all/:
    delete:
      operationId: toys_toys_delete_all_destroy
      tags:
      - toys
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCollectionSummary'
          description: ''
  /toys/toys/export/:
    get:
      operationId: toys_toys_export_retrieve
      tags:
      - toys
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportEnvelope'
          description: ''
  /toys/toys/import/:
    post:
      operationId: toys_toys_import_create
      tags:
      - toys
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportEnvelopeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExportEnvelopeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExportEnvelopeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportSummary'
          description: ''
components:
  schemas:
    ActivityDay:
      type: object
      properties:
        date:
          type: string
          format: date
        session_count:
          type: integer
        max_insertable_length:
          type: number
          format: double
          nullable: true
        max_circumference:
          type: number
          format: double
          nullable: true
      required:
      - date
      - max_circumference
      - max_insertable_length
      - session_count
    ActivityResponse:
      type: object
      properties:
        days:
          type: array
          items:
            $ref: '#/components/schemas/ActivityDay'
      required:
      - days
    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - current_password
      - new_password
    CurveAngleEnum:
      enum:
      - 0
      - 45
      - 90
      - 135
      - 180
      type: integer
      description: |-
        * `0` - 0°
        * `45` - 45°
        * `90` - 90°
        * `135` - 135°
        * `180` - 180°
    DeleteCollectionSummary:
      type: object
      properties:
        toys_deleted:
          type: integer
        sessions_deleted:
          type: integer
      required:
      - sessions_deleted
      - toys_deleted
    ExportEnvelope:
      type: object
      properties:
        version:
          type: integer
        exported_at:
          type: string
        toys:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - exported_at
      - toys
      - version
    ExportEnvelopeRequest:
      type: object
      properties:
        version:
          type: integer
        exported_at:
          type: string
          minLength: 1
        toys:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - exported_at
      - toys
      - version
    ImportSummary:
      type: object
      properties:
        toys_created:
          type: integer
        sessions_created:
          type: integer
      required:
      - sessions_created
      - toys_created
    InvolvementEnum:
      enum:
      - USED
      - INSERTED
      - FULLY_INSERTED
      type: string
      description: |-
        * `USED` - Used
        * `INSERTED` - Inserted
        * `FULLY_INSERTED` - Fully inserted
    PatchedSessionRequest:
      type: object
      properties:
        started_at:
          type: string
          format: date-time
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ToySessionEntryRequest'
    PatchedToyRequest:
      type: object
      properties:
        brand:
          type: string
          minLength: 1
          maxLength: 255
        name:
          type: string
          minLength: 1
          maxLength: 255
        shape:
          $ref: '#/components/schemas/ToyShapeRequest'
        size:
          type: string
          minLength: 1
          maxLength: 100
        date_purchased:
          type: string
          format: date
          nullable: true
        retired:
          type: boolean
        color:
          type: string
          nullable: true
          maxLength: 50
        insertable_length:
          type: number
          format: double
          nullable: true
        total_length:
          type: number
          format: double
          nullable: true
        circumference:
          type: number
          format: double
          nullable: true
        custom_attributes:
          type: object
          additionalProperties:
            type: string
    SectionShapeEnum:
      enum:
      - FLAT
      - EGG
      - CONE
      - SPIKE
      type: string
      description: |-
        * `FLAT` - Flat
        * `EGG` - Egg
        * `CONE` - Cone
        * `SPIKE` - Spike
    Session:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        started_at:
          type: string
          format: date-time
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ToySessionEntry'
        max_insertable_length:
          type: number
          format: double
          nullable: true
          readOnly: true
        max_circumference:
          type: number
          format: double
          nullable: true
          readOnly: true
      required:
      - entries
      - id
      - max_circumference
      - max_insertable_length
      - started_at
    SessionMediaIndicators:
      type: object
      properties:
        configured:
          type: boolean
        session_ids:
          type: array
          items:
            type: integer
      required:
      - configured
      - session_ids
    SessionMediaItem:
      type: object
      properties:
        id:
          type: string
        kind:
          $ref: '#/components/schemas/SessionMediaKindEnum'
        taken_at:
          type: string
          nullable: true
        thumbnail_url:
          type: string
        full_url:
          type: string
      required:
      - full_url
      - id
      - kind
      - taken_at
      - thumbnail_url
    SessionMediaKindEnum:
      enum:
      - image
      - video
      type: string
      description: |-
        * `image` - image
        * `video` - video
    SessionMediaResponse:
      type: object
      properties:
        configured:
          type: boolean
        items:
          type: array
          items:
            $ref: '#/components/schemas/SessionMediaItem'
      required:
      - configured
      - items
    SessionRequest:
      type: object
      properties:
        started_at:
          type: string
          format: date-time
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ToySessionEntryRequest'
      required:
      - entries
      - started_at
    TokenObtainPair:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - refresh
    TokenObtainPairRequest:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    Toy:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        brand:
          type: string
          maxLength: 255
        name:
          type: string
          maxLength: 255
        shape:
          $ref: '#/components/schemas/ToyShape'
        size:
          type: string
          maxLength: 100
        date_purchased:
          type: string
          format: date
          nullable: true
        retired:
          type: boolean
        color:
          type: string
          nullable: true
          maxLength: 50
        insertable_length:
          type: number
          format: double
          nullable: true
        total_length:
          type: number
          format: double
          nullable: true
        circumference:
          type: number
          format: double
          nullable: true
        custom_attributes:
          type: object
          additionalProperties:
            type: string
        usage_count:
          type: integer
          readOnly: true
      required:
      - brand
      - id
      - name
      - shape
      - size
      - usage_count
    ToyRequest:
      type: object
      properties:
        brand:
          type: string
          minLength: 1
          maxLength: 255
        name:
          type: string
          minLength: 1
          maxLength: 255
        shape:
          $ref: '#/components/schemas/ToyShapeRequest'
        size:
          type: string
          minLength: 1
          maxLength: 100
        date_purchased:
          type: string
          format: date
          nullable: true
        retired:
          type: boolean
        color:
          type: string
          nullable: true
          maxLength: 50
        insertable_length:
          type: number
          format: double
          nullable: true
        total_length:
          type: number
          format: double
          nullable: true
        circumference:
          type: number
          format: double
          nullable: true
        custom_attributes:
          type: object
          additionalProperties:
            type: string
      required:
      - brand
      - name
      - shape
      - size
    ToySessionEntry:
      type: object
      properties:
        toy:
          type: integer
        involvement:
          $ref: '#/components/schemas/InvolvementEnum'
      required:
      - involvement
      - toy
    ToySessionEntryRequest:
      type: object
      properties:
        toy:
          type: integer
        involvement:
          $ref: '#/components/schemas/InvolvementEnum'
      required:
      - involvement
      - toy
    ToyShape:
      type: object
      properties:
        top_section_shape:
          $ref: '#/components/schemas/SectionShapeEnum'
        bottom_section_shape:
          $ref: '#/components/schemas/SectionShapeEnum'
        sections:
          type: array
          items:
            $ref: '#/components/schemas/ToyShapeSection'
      required:
      - sections
    ToyShapeRequest:
      type: object
      properties:
        top_section_shape:
          $ref: '#/components/schemas/SectionShapeEnum'
        bottom_section_shape:
          $ref: '#/components/schemas/SectionShapeEnum'
        sections:
          type: array
          items:
            $ref: '#/components/schemas/ToyShapeSectionRequest'
      required:
      - sections
    ToyShapeSection:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        order:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        height:
          type: number
          format: double
        diameter:
          type: number
          format: double
        circumference:
          type: number
          format: double
          nullable: true
        top_curve_angle:
          allOf:
          - $ref: '#/components/schemas/CurveAngleEnum'
          minimum: -9223372036854775808
          maximum: 9223372036854775807
        bottom_curve_angle:
          allOf:
          - $ref: '#/components/schemas/CurveAngleEnum'
          minimum: -9223372036854775808
          maximum: 9223372036854775807
      required:
      - diameter
      - height
      - id
      - order
    ToyShapeSectionRequest:
      type: object
      properties:
        order:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        height:
          type: number
          format: double
        diameter:
          type: number
          format: double
        circumference:
          type: number
          format: double
          nullable: true
        top_curve_angle:
          allOf:
          - $ref: '#/components/schemas/CurveAngleEnum'
          minimum: -9223372036854775808
          maximum: 9223372036854775807
        bottom_curve_angle:
          allOf:
          - $ref: '#/components/schemas/CurveAngleEnum'
          minimum: -9223372036854775808
          maximum: 9223372036854775807
      required:
      - diameter
      - height
      - order
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
