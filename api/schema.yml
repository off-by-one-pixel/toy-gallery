openapi: 3.0.3
info:
  title: Toy Gallery API
  version: 1.0.0
paths:
  /toys/change_password/:
    post:
      operationId: toys_change_password_create
      tags:
      - toys
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /toys/sessions/:
    get:
      operationId: toys_sessions_list
      parameters:
      - in: query
        name: end
        schema:
          type: string
          format: date
      - in: query
        name: has_media
        schema:
          type: boolean
      - in: query
        name: ordering
        schema:
          enum:
          - started_at
          - -started_at
          - duration
          - -duration
          - length
          - -length
          - circumference
          - -circumference
          type: string
          minLength: 1
        description: |-
          * `started_at` - started_at
          * `-started_at` - -started_at
          * `duration` - duration
          * `-duration` - -duration
          * `length` - length
          * `-length` - -length
          * `circumference` - circumference
          * `-circumference` - -circumference
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: start
        schema:
          type: string
          format: date
      - in: query
        name: toys
        schema:
          type: array
          items:
            type: integer
      - in: query
        name: tz
        schema:
          type: string
          minLength: 1
          default: UTC
      tags:
      - toys
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSessionList'
          description: ''
    post:
      operationId: toys_sessions_create
      tags:
      - toys
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SessionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SessionRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
  /toys/sessions/{id}/:
    get:
      operationId: toys_sessions_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this session.
        required: true
      tags:
      - toys
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
    put:
      operationId: toys_sessions_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this session.
        required: true
      tags:
      - toys
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SessionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SessionRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
    patch:
      operationId: toys_sessions_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this session.
        required: true
      tags:
      - toys
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSessionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSessionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSessionRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
    delete:
      operationId: toys_sessions_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this session.
        required: true
      tags:
      - toys
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /toys/sessions/{id}/media/:
    get:
      operationId: toys_sessions_media_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this session.
        required: true
      tags:
      - toys
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionMediaResponse'
          description: ''
  /toys/sessions/live/:
    get:
      operationId: toys_sessions_live_retrieve
      tags:
      - toys
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveSessionResponse'
          description: ''
  /toys/sessions/media-status/:
    get:
      operationId: toys_sessions_media_status_retrieve
      tags:
      - toys
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaStatus'
          description: ''
  /toys/sessions/rebuild-records/:
    post:
      operationId: toys_sessions_rebuild_records_create
      tags:
      - toys
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRecordsRebuildResponse'
          description: ''
  /toys/sessions/refresh-media/:
    post:
      operationId: toys_sessions_refresh_media_create
      tags:
      - toys
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshMediaResponse'
          description: ''
  /toys/sessions/start/:
    post:
      operationId: toys_sessions_start_create
      tags:
      - toys
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
  /toys/sessions/stats/:
    get:
      operationId: toys_sessions_stats_retrieve
      parameters:
      - in: query
        name: end
        schema:
          type: string
          format: date
      - in: query
        name: group_by
        schema:
          enum:
          - date
          - hour
          - weekday
          - toy
          type: string
          minLength: 1
        description: |-
          * `date` - date
          * `hour` - hour
          * `weekday` - weekday
          * `toy` - toy
        required: true
      - in: query
        name: has_media
        schema:
          type: boolean
      - in: query
        name: metrics
        schema:
          type: string
          minLength: 1
        description: 'Comma-separated metrics: ''count'' or ''<func>:<field>'' with
          func in min|max|avg|sum|first|last and field in insertable_length|circumference|duration.'
        required: true
      - in: query
        name: start
        schema:
          type: string
          format: date
      - in: query
        name: toys
        schema:
          type: array
          items:
            type: integer
      - in: query
        name: tz
        schema:
          type: string
          minLength: 1
          default: UTC
      tags:
      - toys
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatsResponse'
          description: ''
  /toys/token/:
    post:
      operationId: toys_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - toys
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /toys/token/refresh/:
    post:
      operationId: toys_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - toys
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /toys/toys/:
    get:
      operationId: toys_toys_list
      tags:
      - toys
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Toy'
          description: ''
    post:
      operationId: toys_toys_create
      tags:
      - toys
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ToyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ToyRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Toy'
          description: ''
  /toys/toys/{id}/:
    get:
      operationId: toys_toys_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this toy.
        required: true
      tags:
      - toys
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Toy'
          description: ''
    put:
      operationId: toys_toys_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this toy.
        required: true
      tags:
      - toys
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ToyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ToyRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Toy'
          description: ''
    patch:
      operationId: toys_toys_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this toy.
        required: true
      tags:
      - toys
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedToyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedToyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedToyRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Toy'
          description: ''
    delete:
      operationId: toys_toys_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this toy.
        required: true
      tags:
      - toys
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /toys/toys/delete_all/:
    delete:
      operationId: toys_toys_delete_all_destroy
      tags:
      - toys
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCollectionSummary'
          description: ''
  /toys/toys/export/:
    get:
      operationId: toys_toys_export_retrieve
      tags:
      - toys
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportEnvelope'
          description: ''
  /toys/toys/import/:
    post:
      operationId: toys_toys_import_create
      tags:
      - toys
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportEnvelopeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExportEnvelopeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExportEnvelopeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportSummary'
          description: ''
components:
  schemas:
    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - current_password
      - new_password
    CurveAngleEnum:
      enum:
      - 0
      - 45
      - 90
      - 135
      - 180
      type: integer
      description: |-
        * `0` - 0°
        * `45` - 45°
        * `90` - 90°
        * `135` - 135°
        * `180` - 180°
    DeleteCollectionSummary:
      type: object
      properties:
        toys_deleted:
          type: integer
        sessions_deleted:
          type: integer
      required:
      - sessions_deleted
      - toys_deleted
    ExportEnvelope:
      type: object
      properties:
        version:
          type: integer
        exported_at:
          type: string
        toys:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - exported_at
      - toys
      - version
    ExportEnvelopeRequest:
      type: object
      properties:
        version:
          type: integer
        exported_at:
          type: string
          minLength: 1
        toys:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - exported_at
      - toys
      - version
    ImportSummary:
      type: object
      properties:
        toys_created:
          type: integer
        sessions_created:
          type: integer
      required:
      - sessions_created
      - toys_created
    InvolvementEnum:
      enum:
      - USED
      - INSERTED
      - FULLY_INSERTED
      type: string
      description: |-
        * `USED` - Used
        * `INSERTED` - Inserted
        * `FULLY_INSERTED` - Fully inserted
    LiveSessionResponse:
      type: object
      properties:
        session:
          allOf:
          - $ref: '#/components/schemas/Session'
          nullable: true
      required:
      - session
    MediaStatus:
      type: object
      properties:
        configured:
          type: boolean
      required:
      - configured
    PaginatedSessionList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Session'
    PatchedSessionRequest:
      type: object
      properties:
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true
        photo_count:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        video_count:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ToySessionEntryRequest'
    PatchedToyRequest:
      type: object
      properties:
        brand:
          type: string
          minLength: 1
          maxLength: 255
        name:
          type: string
          minLength: 1
          maxLength: 255
        shape:
          $ref: '#/components/schemas/ToyShapeRequest'
        size:
          type: string
          minLength: 1
          maxLength: 100
        date_purchased:
          type: string
          format: date
          nullable: true
        retired:
          type: boolean
        color:
          type: string
          nullable: true
          maxLength: 50
        insertable_length:
          type: number
          format: double
          nullable: true
        total_length:
          type: number
          format: double
          nullable: true
        circumference:
          type: number
          format: double
          nullable: true
        custom_attributes:
          type: object
          additionalProperties:
            type: string
    PersonalRecord:
      type: object
      properties:
        value:
          type: number
          format: double
        key:
          type: string
          maxLength: 16
        toy:
          type: integer
          readOnly: true
        achieved_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - achieved_at
      - key
      - toy
      - value
    PersonalRecordRequest:
      type: object
      properties:
        value:
          type: number
          format: double
        key:
          type: string
          minLength: 1
          maxLength: 16
      required:
      - key
      - value
    RefreshMediaResponse:
      type: object
      properties:
        configured:
          type: boolean
        sessions_with_media:
          type: integer
      required:
      - configured
      - sessions_with_media
    SectionShapeEnum:
      enum:
      - FLAT
      - EGG
      - CONE
      - SPIKE
      type: string
      description: |-
        * `FLAT` - Flat
        * `EGG` - Egg
        * `CONE` - Cone
        * `SPIKE` - Spike
    Session:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true
        is_live:
          type: boolean
          readOnly: true
        photo_count:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        video_count:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ToySessionEntry'
        records:
          type: array
          items:
            $ref: '#/components/schemas/PersonalRecord'
          readOnly: true
        max_insertable_length:
          type: number
          format: double
          nullable: true
          readOnly: true
        max_circumference:
          type: number
          format: double
          nullable: true
          readOnly: true
        total_toy_duration_minutes:
          type: integer
          nullable: true
          readOnly: true
      required:
      - entries
      - id
      - is_live
      - max_circumference
      - max_insertable_length
      - records
      - started_at
      - total_toy_duration_minutes
    SessionMediaItem:
      type: object
      properties:
        id:
          type: string
        kind:
          $ref: '#/components/schemas/SessionMediaKindEnum'
        taken_at:
          type: string
          nullable: true
        thumbnail_url:
          type: string
        full_url:
          type: string
      required:
      - full_url
      - id
      - kind
      - taken_at
      - thumbnail_url
    SessionMediaKindEnum:
      enum:
      - image
      - video
      type: string
      description: |-
        * `image` - image
        * `video` - video
    SessionMediaResponse:
      type: object
      properties:
        configured:
          type: boolean
        items:
          type: array
          items:
            $ref: '#/components/schemas/SessionMediaItem'
        share_url:
          type: string
          nullable: true
      required:
      - configured
      - items
      - share_url
    SessionRecordsRebuildResponse:
      type: object
      properties:
        records:
          type: integer
      required:
      - records
    SessionRequest:
      type: object
      properties:
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true
        photo_count:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        video_count:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ToySessionEntryRequest'
      required:
      - entries
      - started_at
    SessionStatsResponse:
      type: object
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/StatsGroup'
      required:
      - groups
    StatsGroup:
      type: object
      properties:
        key:
          type: string
        values:
          type: object
          additionalProperties:
            type: number
            format: double
            nullable: true
      required:
      - key
      - values
    TokenObtainPair:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - refresh
    TokenObtainPairRequest:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    Toy:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        brand:
          type: string
          maxLength: 255
        name:
          type: string
          maxLength: 255
        shape:
          $ref: '#/components/schemas/ToyShape'
        size:
          type: string
          maxLength: 100
        date_purchased:
          type: string
          format: date
          nullable: true
        retired:
          type: boolean
        color:
          type: string
          nullable: true
          maxLength: 50
        insertable_length:
          type: number
          format: double
          nullable: true
        total_length:
          type: number
          format: double
          nullable: true
        circumference:
          type: number
          format: double
          nullable: true
        custom_attributes:
          type: object
          additionalProperties:
            type: string
