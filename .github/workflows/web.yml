name: web CI

on:
  pull_request:
    paths:
      - "web/**"
      - "toy-editor/**"
      - "api/schema.yml"
      - ".github/workflows/web.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "toy-editor/**"
      - "api/schema.yml"
      - ".github/workflows/web.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            toy-editor/package-lock.json

      - name: Install and build toy-editor
        working-directory: toy-editor
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        run: npm ci

      - name: Generate API SDK
        run: npm run codegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
