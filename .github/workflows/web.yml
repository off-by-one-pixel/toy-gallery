name: web CI

on:
  pull_request:
    paths:
      - "web/**"
      - "toy-editor/**"
      - "api/schema.yml"
      - ".github/workflows/web.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "toy-editor/**"
      - "api/schema.yml"
      - ".github/workflows/web.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck and build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build toy-editor
        run: pnpm --filter toy-editor build

      - name: Lint toy-editor
        run: pnpm --filter toy-editor lint

      - name: Test toy-editor
        run: pnpm --filter toy-editor test

      - name: Generate API SDK
        run: pnpm --filter web codegen

      - name: Typecheck
        run: pnpm --filter web exec tsc --noEmit

      - name: Lint
        run: pnpm --filter web lint

      - name: Test
        run: pnpm --filter web test

      - name: Build
        run: pnpm --filter web build
