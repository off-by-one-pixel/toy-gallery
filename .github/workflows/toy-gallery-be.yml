name: toy-gallery-be CI

on:
  pull_request:
    paths:
      - "toy_gallery_be/**"
      - ".github/workflows/toy-gallery-be.yml"
  push:
    branches: [main]
    paths:
      - "toy_gallery_be/**"
      - ".github/workflows/toy-gallery-be.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Django tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: toy_gallery_be
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: toy_gallery_be/uv.lock

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run python manage.py test toys
