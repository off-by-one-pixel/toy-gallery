name: api CI

on:
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/api.yml"
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Django tests
    runs-on: self-hosted
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run python manage.py test toys
