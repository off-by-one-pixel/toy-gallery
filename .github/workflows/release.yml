name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+*'

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build and push tagged image to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/toy-gallery
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.ref_name }}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            APP_COMMIT_SHA=${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        run: |
          VERSION=2.6.1
          curl -fsSL "https://github.com/orhun/git-cliff/releases/download/v${VERSION}/git-cliff-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin "git-cliff-${VERSION}/git-cliff"

      - name: Generate changelog
        id: cliff
        run: |
          CHANGELOG=$(git-cliff --config cliff.toml --latest --strip header)
          {
            echo 'content<<CLIFF_EOF'
            echo "$CHANGELOG"
            echo CLIFF_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Compose release body
        id: body
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/toy-gallery
          TAG: ${{ github.ref_name }}
          CHANGELOG: ${{ steps.cliff.outputs.content }}
        run: |
          {
            echo 'body<<EOF'
            echo "$CHANGELOG"
            echo
            echo '---'
            echo
            echo '🐳 Pull this release:'
            echo
            echo '```'
            echo "docker pull $IMAGE:$TAG"
            echo '```'
            echo
            echo "Image on GHCR: https://github.com/${{ github.repository }}/pkgs/container/toy-gallery"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Detect pre-release
        id: prerelease
        run: |
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.body.outputs.body }}
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          draft: false
