name: SonarQube

on:
  push:
    branches: [main]

jobs:
  analysis:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v4
      - name: Install BE dependencies
        run: cd api && uv sync --frozen
      - name: Run BE tests with coverage
        run: |
          cd api
          uv run coverage run --source=toys manage.py test toys
          uv run coverage xml -o coverage.xml
          sed -i \
            -e 's|<source>.*</source>|<source>.</source>|' \
            -e 's|filename="toys/|filename="api/toys/|g' \
            coverage.xml

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        run: corepack enable pnpm
      - name: Install and build toy-editor
        working-directory: toy-editor
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Install FE dependencies
        run: cd web && pnpm install --frozen-lockfile
      - name: Run FE tests with coverage
        run: |
          cd web
          pnpm test --coverage
          sed -i 's|^SF:src/|SF:web/src/|' coverage/lcov.info

      - name: Keep scanner downloads in the runner home
        run: echo "SONAR_USER_HOME=$HOME/.sonar" >> "$GITHUB_ENV"

      - name: SonarQube Scan and Quality Gate
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: >
            -Dsonar.projectVersion=${{ github.sha }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
