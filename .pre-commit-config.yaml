repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        name: ruff lint (backend)
        args: [--fix]
        files: ^api/.*\.py$

  - repo: local
    hooks:
      - id: prettier
        name: prettier (frontend)
        entry: web/node_modules/.bin/prettier --write
        language: system
        files: ^web/src/.*\.(ts|tsx)$
        pass_filenames: true

      - id: eslint
        name: eslint (frontend)
        entry: bash -c 'cd web && ./node_modules/.bin/eslint --fix "${@#web/}"' --
        language: system
        files: ^web/src/.*\.(ts|tsx)$
        pass_filenames: true
