repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff-check
        name: ruff lint (backend)
        args: [--fix]
        files: ^api/.*\.py$

      - id: ruff-format
        name: ruff format (backend)
        files: ^api/.*\.py$

  - repo: local
    hooks:
      - id: prettier
        name: prettier (frontend)
        entry: node_modules/.bin/prettier --write
        language: system
        files: ^(web/src/.*\.(ts|tsx)|toy-editor/src/.*\.(ts|tsx|css))$
        pass_filenames: true

      - id: eslint
        name: eslint (frontend)
        entry: node_modules/.bin/eslint --fix
        language: system
        files: ^(web|toy-editor)/src/.*\.(ts|tsx)$
        pass_filenames: true
