# Pre-commit hooks run on every `git commit`. Install once per clone with
# `pre-commit install` (the devcontainer's postCreateCommand handles this).
#
# Two scopes:
#   - Backend Python (api/) → Ruff lint with auto-fix.
#   - Frontend TS/TSX (web/src/) → Prettier auto-format.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        name: ruff lint (backend)
        args: [--fix]
        files: ^api/.*\.py$

  - repo: local
    hooks:
      - id: prettier
        name: prettier (frontend)
        # Run prettier from the project's own node_modules so the version
        # matches what the dev runs locally via `npm run format`. Prettier
        # auto-discovers web/.prettierrc.json.
        entry: web/node_modules/.bin/prettier --write
        language: system
        files: ^web/src/.*\.(ts|tsx)$
        pass_filenames: true
