services:
  python-api:
    build:
      context: .
      dockerfile: Dockerfile_python
    volumes:
      - .:/workspace
    command: sleep infinity
    networks:
      - app-network

  node-app:
    build:
      context: .
      dockerfile: Dockerfile_node
    volumes:
      - .:/workspace
    command: sleep infinity
    networks:
      - app-network

networks:
  app-network:
    driver: bridge