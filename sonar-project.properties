sonar.projectKey=toy-gallery
sonar.projectName=Toy Gallery

# Modules in scope: Django backend + Next.js frontend.
# The cone_editor submodule has its own analysis upstream, so we skip it.
sonar.sources=api/toys,cone-visualization/src
sonar.tests=api/toys,cone-visualization/src

sonar.test.inclusions=\
  api/toys/tests.py,\
  cone-visualization/src/**/*.test.ts,\
  cone-visualization/src/**/*.test.tsx,\
  cone-visualization/src/**/*.spec.ts,\
  cone-visualization/src/**/*.spec.tsx

# NOTE: SonarQube's WildcardPattern supports `*`, `**`, and `?` only —
# brace expansion `{a,b}` is treated literally, which is why earlier
# patterns like `*.{test,spec}.{ts,tsx}` silently matched nothing.
sonar.exclusions=\
  **/migrations/**,\
  **/node_modules/**,\
  **/.next/**,\
  **/dist/**,\
  cone-visualization/src/services/generated/**,\
  cone_editor/**,\
  api/toys/tests.py,\
  cone-visualization/src/**/*.test.ts,\
  cone-visualization/src/**/*.test.tsx,\
  cone-visualization/src/**/*.spec.ts,\
  cone-visualization/src/**/*.spec.tsx

sonar.coverage.exclusions=\
  api/toys/tests.py,\
  cone-visualization/src/**/*.test.ts,\
  cone-visualization/src/**/*.test.tsx,\
  cone-visualization/src/**/*.spec.ts,\
  cone-visualization/src/**/*.spec.tsx

sonar.python.coverage.reportPaths=api/coverage.xml
sonar.python.version=3.13

sonar.javascript.lcov.reportPaths=cone-visualization/coverage/lcov.info
sonar.typescript.lcov.reportPaths=cone-visualization/coverage/lcov.info

sonar.sourceEncoding=UTF-8
