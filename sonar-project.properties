sonar.projectKey=toy-gallery
sonar.projectName=Toy Gallery

sonar.sources=api/toys,web/src
sonar.tests=api/toys,web/src

sonar.test.inclusions=\
  api/toys/test*.py,\
  web/src/**/*.test.ts,\
  web/src/**/*.test.tsx,\
  web/src/**/*.spec.ts,\
  web/src/**/*.spec.tsx

sonar.exclusions=\
  **/migrations/**,\
  **/node_modules/**,\
  **/.next/**,\
  **/dist/**,\
  web/src/api/generated/**,\
  toy-editor/**,\
  api/toys/test*.py,\
  web/src/**/*.test.ts,\
  web/src/**/*.test.tsx,\
  web/src/**/*.spec.ts,\
  web/src/**/*.spec.tsx

sonar.coverage.exclusions=\
  api/toys/test*.py,\
  web/src/**/*.test.ts,\
  web/src/**/*.test.tsx,\
  web/src/**/*.spec.ts,\
  web/src/**/*.spec.tsx

sonar.python.coverage.reportPaths=api/coverage.xml
sonar.python.version=3.13

sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
sonar.typescript.lcov.reportPaths=web/coverage/lcov.info

sonar.sourceEncoding=UTF-8
